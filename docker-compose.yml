name: agile-task-manager

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agile}
      POSTGRES_DB: ${POSTGRES_DB:-agile}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agile} -d ${POSTGRES_DB:-agile}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agile}:${POSTGRES_PASSWORD:-agile}@db:5432/${POSTGRES_DB:-agile}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
      AI_ENABLED: ${AI_ENABLED:-true}
      # По умолчанию — Ollama, запущенная на хосте (на macOS только так работает GPU/Metal).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Необязательно: Ollama в контейнере (Linux/без локальной установки). Включается так:
  #   OLLAMA_BASE_URL=http://ollama:11434 docker compose --profile ollama up --build
  #   docker compose exec ollama ollama pull qwen2.5:3b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
